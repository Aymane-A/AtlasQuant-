name: paper-log

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - run: pip install -r requirements.txt

      - run: python src/paper_log.py

      - name: Commit logs
        if: always()
        working-directory: .
        run: |
          git config user.name "paper-log-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ai-service/data/live/forecasts.csv ai-service/data/live/run_log.csv ai-service/data/live/candles.csv
          git diff --cached --quiet || (git commit -m "paper log $(date -u +%FT%H:%MZ)" && git pull --rebase && git push)
