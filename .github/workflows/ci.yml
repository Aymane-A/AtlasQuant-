name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build must FAIL without API URLs
        run: "! npm run build"
      - name: Production build with API URLs
        run: npm run build
        env:
          VITE_API_URL: https://api.example.test/api
          VITE_WS_URL: wss://api.example.test
      - run: npm audit --omit=dev --audit-level=high

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      # requirements.txt is a Windows pip freeze: drop the Windows-only packages.
      - run: grep -viE '^(pywinpty|colorama)==' requirements.txt > /tmp/requirements-ci.txt && pip install -r /tmp/requirements-ci.txt
      - run: python -m pytest -q tests
