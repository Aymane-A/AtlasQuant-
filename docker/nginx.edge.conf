# AtlasQuant AI — TLS edge: one public origin for SPA + API + WebSocket.
# Used by the optional `edge` profile:  docker compose --profile edge up --build
# Put your certificate in docker/certs/fullchain.pem and docker/certs/privkey.pem (never commit them).
# With this edge, build the SPA with the same-origin URLs:
#   VITE_API_URL=https://YOUR_DOMAIN/api  VITE_WS_URL=wss://YOUR_DOMAIN
# and run the backend with TRUST_PROXY=1 and FRONTEND_URL=https://YOUR_DOMAIN.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Per-IP request limit in front of the app's own limiter (login/register are also limited in Express).
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 1m;          # the API takes JSON only; raise per-location if you add uploads

  # REST API
  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    130s;     # backend server.timeout is 120 s (backtests can be slow)
  }

  # WebSockets (/ws/market, /ws/dashboard): needs the Upgrade headers and a long read timeout
  location /ws/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;       # idle sockets stay open; the server pushes every 10-30 s
    proxy_send_timeout 3600s;
  }

  # Everything else = the SPA container
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
