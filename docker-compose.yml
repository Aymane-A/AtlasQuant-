# AtlasQuant AI — local/prod-like stack:  docker compose up --build
# Needs DB_PASSWORD and AI_SERVICE_KEY (shell or root .env). Optional TLS edge:  docker compose --profile edge up --build
# Requires backend/.env (copy backend/.env.example). The values below override it for the container network.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlasquant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your shell or a root .env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlasquant"]
      interval: 5s
      timeout: 5s
      retries: 10
    # not published to the host on purpose; uncomment to use psql/pgAdmin from your machine:
    # ports: ["5432:5432"]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: atlasquant
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"                       # in-network Postgres, no TLS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  # Volatility model (/predict). NOT published to the host: reachable only from other containers
  # as http://ai-service:8000 (callers must send the X-API-Key header). The backend does not call it yet.
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/ai-service.Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?set AI_SERVICE_KEY in your shell or a root .env file}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Optional TLS edge (profile "edge"): https://<domain> -> SPA, /api -> backend, /ws -> backend (WebSocket).
  # Needs docker/certs/fullchain.pem + privkey.pem. See docker/nginx.edge.conf for the build/env values to use.
  edge:
    profiles: ["edge"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./docker/nginx.edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata:
